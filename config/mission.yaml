# Mars EVA Command — single source of mission configuration.
# Every derived product records this file's build_id; change anything here and rerun the pipeline.
schema_version: "1.0.0"
mission:
  id: marswalk-1
  name: "Marswalk 1"
  site: "Jezero Crater, Mars"
  scenario_note: >-
    Fictional two-person crew EVA at a real robotic mission site. Perseverance's landing
    does not certify a location for a human lander. The depot task is visual inspection and
    documentation only; it is not a NASA plan for human sample retrieval.

crs:
  # Planetary geographic CRS of all source products (Mars 2000 sphere, east-positive, planetocentric).
  geographic: "+proj=longlat +R=3396190 +no_defs"
  # Source mosaics: equirectangular, true scale at the equator.
  source_eqc: "+proj=eqc +lat_ts=0 +lat_0=0 +lon_0=0 +R=3396190 +units=m +no_defs"
  # Local working projection (plan §9 Phase 2). lat_0 added only to put the origin near the AOI;
  # it shifts northing and does not change scale. ASSUMPTION A-01.
  local: "+proj=eqc +lat_ts=18.45 +lat_0=18.45 +lon_0=77.45 +R=3396190 +units=m +no_defs"

# Sites. Coordinates are taken from the archived Perseverance waypoint product (M20_waypoints.json),
# never hand-typed. 'rmc' = rover motion counter site_drive of the waypoint used.
lander:
  id: L0
  name: "Hypothetical crew lander — Octavia E. Butler Landing"
  source_sol: 13
  rmc: "3_0"
  plan_reference: { lat: 18.4447, lon: 77.4508 }

# Science stations in itinerary order. Sample IDs/sols/formation from Herd et al. 2025, PNAS Table 1
# (doi:10.1073/pnas.2404255121). Station position = last rover waypoint at or before the sampling sol.
stations:
  - id: S1
    name: "Skinner Ridge outcrop — Hawksbill Gap"
    sample: "Swift Run (M2020-490-11) / Skyland (M2020-495-12)"
    sample_sol: 490
    formation: "Shenandoah formation (fan front)"
    rock: "Sedimentary — sandstone"
    rationale: >-
      Coarser-grained delta-front sandstone exposed where Perseverance climbed the fan front.
      Documents depositional energy and sediment source for the delta.
    task: "Document bedding and grain size; photograph the abraded/cored area at hand-lens scale."
    nasem: [1, 3]
  - id: S2
    name: "Wildcat Ridge outcrop — Hawksbill Gap"
    sample: "Hazeltop (M2020-509-14) / Bearwallow (M2020-516-15)"
    sample_sol: 509
    formation: "Shenandoah formation (fan front)"
    rock: "Sedimentary — fine-grained, sulfate-bearing mudstone"
    rationale: >-
      Fine-grained mudstone ~20 m from Skinner Ridge. Fine-grained lake/delta sediments are
      favoured environments for preserving organic matter and potential biosignatures.
    task: "Compare fine vs coarse textures with S1; context imaging of laminations and veins."
    nasem: [1, 3]
  - id: S3
    name: "Hidden Harbor outcrop — Cape Nukshak"
    sample: "Kukaklek (M2020-623-19)"
    sample_sol: 623
    formation: "Shenandoah formation (fan front)"
    rock: "Sedimentary"
    rationale: "Additional fan-front sedimentary stratigraphy on the Cape Nukshak campaign."
    task: "Stratigraphic context photography; measure bed orientations by eye/compass."
    nasem: [1, 3]
  - id: S4
    name: "Amalik outcrop — Cape Nukshak"
    sample: "Shuyak (M2020-575-16) / Mageik (M2020-579-17)"
    sample_sol: 575
    formation: "Shenandoah formation (fan front)"
    rock: "Sedimentary"
    rationale: "Lower fan-front outcrop near the depot; links the delta stratigraphy to the depot area."
    task: "Document outcrop contacts; compare with S3."
    nasem: [1, 3]

depot:
  id: D1
  name: "Three Forks sample depot (inspection only)"
  sol_range: [653, 690]
  tubes: 10
  note: >-
    Ten tubes were placed between sols 653 and 690, 5-15 m apart. Positions come from the PDS depot bundle
    (rover position at each drop; the tube lies within ~1-2 m). The depot holds the twins of three samples
    from this walk: Skyland (S1 Skinner Ridge), Bearwallow (S2 Wildcat Ridge) and Mageik (S4 Amalik).
    Crew task: visual inspection and documentation only.

aoi:
  margin_m: 1000            # plan §2: bounding box of lander + stops + depot, 1 km margin

terrain:
  dtm_cell_m: 1.0           # HiRISE 1 m posting resampled on the local grid
  route_cell_m: 5.0         # routing grid
  ctx_cell_m: 20.0          # CTX native posting
  min_valid_fraction: 0.9   # 5 m cell needs >=90 % valid 1 m slope support to be HiRISE-supported

routing:
  cost_model_version: "symmetric-max-v1"
  theta_pref_deg: 15.0
  scenarios_deg: [15.0, 20.0, 25.0]
  default_deg: 20.0
  penalty_hirise: 1.0
  penalty_ctx_only: 1.5

walkback:
  budgets_m: [500, 1000, 2000, 10000]
  default_budget_m: 2000

recon:
  block_m: 100              # analysis scale for coverage gaps and the optional AI experiment
  weights: { science: 0.35, gap: 0.30, uncertainty: 0.15, route: 0.20, access: 0.10 }

# NASEM (2026) A Science Strategy for the Human Exploration of Mars, doi:10.17226/28594 — numbering checked 14 Nov 2026
nasem_objectives:
  1: "Habitability and evidence of past or present life in the exploration zone"
  3: "Geologic record and niche-habitat mapping"
  5: "Onset and evolution of major dust storms"
  9: "Effects of martian dust on human physiology and hardware"
  11: "Primary and secondary radiation at key locations"

challenge:
  name: "Interplanetary Survival Guide: Martian Map"
  url: "https://www.spaceappschallenge.org/2026/challenges/interplanetary-survival-guide-martian-map/"
  listed_resources_used: ["JPL Mars Trek (Viking colour and MOLA global mosaics)", "USGS-NASA Planetary Geologic Mapping Program (SIM 3464)", "Mars Perseverance Raw Images Gallery"]

si_acknowledgement: >-
  Super Intelligence (SI) disclosure: the data pipeline, tests, web app code and documentation in this project were
  generated with the help of an AI coding assistant (Claude, Anthropic) from the team's own written plan. The mission
  concept and plan are the team's. All scientific data come from the cited NASA/USGS archives; every number shown is
  computed by the pipeline and logged in docs/validation.md. No images, audio or video in the app are AI-generated
  (all imagery is NASA/USGS spacecraft or rover data).
