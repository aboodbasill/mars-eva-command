<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Marswalk — Jezero EVA</title>
<meta name="description" content="Pick a start and a destination on NASA's map of Mars, then walk the EVA on real HiRISE terrain at Jezero Crater, with suit consumables from NASA EVA data.">
<meta name="si-disclosure" content="SI disclosure: generated with the help of an AI coding assistant (Claude, Anthropic) from the team's plan; reviewed by the team. See SI_DISCLOSURE.md.">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23b5532a%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="game.css">
</head>
<body class="phase-boot">
<canvas id="view" aria-label="3D view"></canvas>
<div id="fx" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<!-- boot -->
<section id="boot" class="screen">
  <div class="boot-in">
    <div class="wordmark">MARSWALK</div>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <div class="boot-msg" id="boot-msg">Loading NASA data</div>
  </div>
</section>

<!-- globe -->
<section id="globe-ui" class="layer hidden">
  <header class="brand"><div class="wordmark">MARSWALK</div><div class="sub">Plan and rehearse a Mars EVA</div></header>
  <div class="globe-tools">
    <div class="seg" role="radiogroup" aria-label="Globe layer">
      <button data-g="viking" class="on">Optical</button><button data-g="mola">Elevation</button>
    </div>
  </div>
  <div class="hint" id="globe-hint">Drag to turn the planet · scroll to zoom · select a site</div>
  <aside class="panel site-card hidden" id="site-card"></aside>
  <footer class="credit">Viking colour mosaic &amp; MOLA relief: NASA/JPL Mars Trek · USGS</footer>
</section>

<!-- site planner -->
<section id="plan-ui" class="layer hidden">
  <aside class="panel planner" id="planner"></aside>
  <div class="hint" id="plan-hint">Click the ground to place your start</div>
</section>

<!-- in-game HUD -->
<section id="hud" class="layer hidden">
  <div class="clock" id="clock"></div>
  <div class="compass" id="compass"><div class="tape" id="tape"></div><div class="needle"></div></div>
  <div class="target" id="target"></div>
  <div class="alerts" id="alerts"></div>
  <div class="prompt hidden" id="prompt"></div>
  <div class="br">
    <div class="vitals" id="vitals"></div>
    <canvas id="minimap" width="460" height="460" aria-label="Minimap"></canvas>
  </div>
  <div class="tr">
    <button class="ibtn" id="b-map" aria-label="Map (M)" title="Map (M)"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14"/></svg></button>
    <button class="ibtn" id="b-menu" aria-label="Menu (Esc)" title="Menu (Esc)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="stick" class="touch-only"><div id="knob"></div></div>
  <div class="tbtns touch-only">
    <button class="tbtn" id="t-auto">Auto</button>
    <button class="tbtn" id="t-run">Run</button>
    <button class="tbtn big" id="t-use">Use</button>
  </div>
</section>

<!-- pause menu -->
<section id="menu" class="screen hidden" role="dialog" aria-label="Menu">
  <div class="menu-in">
    <div class="wordmark small">MARSWALK</div>
    <nav id="menu-items"></nav>
  </div>
</section>

<!-- full map -->
<section id="mapview" class="screen hidden" role="dialog" aria-label="Map">
  <div class="map-wrap"><canvas id="map"></canvas><div class="map-scale" id="map-scale"></div></div>
  <aside class="panel map-side" id="map-side"></aside>
</section>

<!-- modal card -->
<section id="modal" class="screen hidden" role="dialog" aria-modal="true">
  <div class="panel modal-card"><div id="modal-body"></div><div class="actions" id="modal-actions"></div></div>
</section>

<script src="../lib/three.min.js"></script>
<script src="../mars24.js"></script>
<script src="../data/bundle.js"></script>
<script src="../data/grids.js"></script>
<script src="route.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
