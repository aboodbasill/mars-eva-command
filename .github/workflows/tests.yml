name: Tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install numpy scipy pandas pyproj pyyaml rasterio pytest
      - run: python -m pytest -q tests
      - run: node tests/test_mars24.js
