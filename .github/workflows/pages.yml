name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      # the artifact can take a few seconds to become visible to the deploy API; wait, then retry once
      - run: sleep 15
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.first.outcome == 'failure'
        run: sleep 45
      - id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        run: echo "page_url=${{ steps.first.outputs.page_url || steps.retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
